<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الشركاء — Lite Kitchen</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E0596C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --beige-top: #F4ECD8;
    --beige-mid: #EFE4CE;
    --beige-bot: #E5D6B6;
    --watermelon: #E0596C;
    --coral: #F08A5D;
    --olive: #6F7C3E;
    --pink: #E89BA6;
    --ink: #2A241C;
    --ink-soft: #5A4F42;
    --ink-mute: #8A7E6B;
    --card: #FBF3DD;
    --card-edge: rgba(42, 36, 28, 0.10);
    --shadow-sm: 0 4px 12px rgba(42, 36, 28, 0.10);
    --shadow-md: 0 8px 22px rgba(42, 36, 28, 0.18);
    --shadow-lg: 0 16px 40px rgba(42, 36, 28, 0.22);
    --radius-card: 14px;
    --radius-pill: 9999px;
    --bg-page: linear-gradient(180deg, var(--beige-top) 0%, var(--beige-mid) 55%, var(--beige-bot) 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg-page); }
  body {
    font-family: 'Cairo', system-ui, sans-serif;
    color: var(--ink);
    direction: rtl;
    min-height: 100vh;
    background: var(--bg-page);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    top: 12%; right: 15%;
    width: 380px; height: 380px;
    background: var(--watermelon);
    opacity: 0.32;
  }
  body::after {
    bottom: 12%; left: 15%;
    width: 340px; height: 340px;
    background: var(--olive);
    opacity: 0.28;
  }
  .grain::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.14;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 1;
  }
  .box {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 18px;
    padding: 40px 32px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: var(--shadow-lg);
    position: relative;
    z-index: 2;
    transform: rotate(-0.5deg);
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 1.2px;
    color: var(--ink);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .tag::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--watermelon);
  }
  .logo {
    font-size: 38px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 4px;
    transform: rotate(-1deg);
    display: inline-block;
  }
  .logo .grad {
    background: linear-gradient(90deg, var(--watermelon), var(--coral));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 700;
    margin-top: 4px;
    margin-bottom: 28px;
  }
  .divider {
    height: 2px;
    width: 50%;
    margin: 0 0 24px;
    background: linear-gradient(90deg, transparent, var(--watermelon));
    position: relative;
  }
  .divider::after {
    content: "";
    position: absolute;
    right: -2px; top: -6px;
    width: 14px; height: 14px;
    background: var(--watermelon);
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 8px;
    margin-top: 16px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  select, input {
    width: 100%;
    padding: 14px 16px;
    background: #FFF8E7;
    border: 1.5px solid var(--card-edge);
    border-radius: var(--radius-card);
    color: var(--ink);
    font-size: 16px;
    font-family: inherit;
    font-weight: 700;
    transition: all 0.2s;
  }
  select:focus, input:focus {
    outline: none;
    border-color: var(--watermelon);
    background: #FFFCEC;
    box-shadow: 0 0 0 3px rgba(224, 89, 108, 0.12);
  }
  select option { background: var(--card); color: var(--ink); }
  button {
    width: 100%;
    padding: 16px;
    margin-top: 24px;
    background: var(--watermelon);
    color: #FFF8E7;
    border: 0;
    border-radius: var(--radius-pill);
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    box-shadow: var(--shadow-md);
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  button:hover:not(:disabled) { transform: translateY(-2px) rotate(-0.6deg); box-shadow: var(--shadow-lg); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: var(--radius-card);
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    display: none;
  }
  .msg.error { background: rgba(224, 89, 108, 0.12); color: var(--watermelon); border: 1px solid rgba(224, 89, 108, 0.3); display: block; }
  .msg.ok { background: rgba(111, 124, 62, 0.12); color: var(--olive); border: 1px solid rgba(111, 124, 62, 0.3); display: block; }
  .hint {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-mute);
    line-height: 1.7;
    font-weight: 700;
  }
  .hint a { color: var(--olive); text-decoration: none; font-weight: 900; }
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: var(--ink-mute);
    font-weight: 700;
    position: relative;
    z-index: 2;
  }
</style>
</head>
<body class="grain">
  <div class="box">
    <div class="tag">دخول الشركاء</div>
    <div class="logo">Lite <span class="grad">Kitchen</span></div>
    <div class="subtitle">منطقة الإدارة الخاصة بالشركاء</div>
    <div class="divider"></div>

    <label for="identitySelect">اختر رمز الدخول الخاص بك</label>
    <select id="identitySelect">
      <option value="">— جاري التحميل... —</option>
    </select>

    <label for="accessKey">المفتاح السري</label>
    <input type="password" id="accessKey" placeholder="••••••••••••••" autocomplete="off">

    <button id="loginBtn">دخول</button>

    <div id="msg" class="msg"></div>

    <div class="hint">
      رمز الدخول والمفتاح السري وصلك في رسالة خاصة من إدارة المطعم.<br>
      للاستفسار: <a href="https://wa.me/966558612908">واتساب الإدارة</a>
    </div>
  </div>

  <div class="footer">© Lite Kitchen — حائل</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://bmtlorchhzzbbrmlmmpf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ImtLuEDFKMHiQpoDaJCkSg_ghKxOFUA';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const showMsg = (text, type='error') => {
  const m = $('msg');
  m.textContent = text;
  m.className = `msg ${type}`;
};

async function loadIdentities() {
  const { data, error } = await sb
    .from('staff_public_list')
    .select('id, display_label');

  const sel = $('identitySelect');
  sel.innerHTML = '<option value="">— اختر رمزك —</option>';

  if (error) {
    showMsg('تعذّر تحميل القائمة. حدّث الصفحة.');
    return;
  }

  const shuffled = [...(data || [])].sort(() => Math.random() - 0.5);
  shuffled.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.display_label || s.id;
    sel.appendChild(opt);
  });
}

$('loginBtn').addEventListener('click', async () => {
  const staffId = $('identitySelect').value;
  const key = $('accessKey').value.trim();

  if (!staffId) { showMsg('اختر رمزك من القائمة'); return; }
  if (!key) { showMsg('أدخل المفتاح السري'); return; }

  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'جاري التحقق...';

  try {
    const { data, error } = await sb.rpc('authenticate_by_key', { p_key: key });

    if (error || !data || data.length === 0) {
      showMsg('المفتاح السري غير صحيح');
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = 'دخول';
      return;
    }

    const auth = data[0];

    if (auth.staff_id !== staffId) {
      showMsg('المفتاح لا يطابق الرمز المختار');
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = 'دخول';
      return;
    }

    sessionStorage.setItem('lk_staff_id', auth.staff_id);
    sessionStorage.setItem('lk_staff_name', auth.full_name);
    sessionStorage.setItem('lk_staff_label', auth.display_label);
    sessionStorage.setItem('lk_staff_role', auth.role);
    sessionStorage.setItem('lk_partner_type', auth.partner_type || '');
    sessionStorage.setItem('lk_is_hidden', String(auth.is_hidden));

    showMsg('تم الدخول بنجاح، جاري التحويل...', 'ok');

    setTimeout(() => {
      if (auth.role === 'owner') {
        window.location.href = 'owner-dashboard.html';
      } else if (auth.role === 'kitchen' || auth.staff_id === 'STAFF-002') {
        window.location.href = 'kitchen-dashboard.html';
      } else {
        window.location.href = 'partner-dashboard.html';
      }
    }, 600);

  } catch (e) {
    showMsg('خطأ في الاتصال: ' + e.message);
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = 'دخول';
  }
});

$('accessKey').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') $('loginBtn').click();
});

loadIdentities();
</script>
</body>
</html>
