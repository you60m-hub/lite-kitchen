<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رمز اشتراكك — Lite Kitchen</title>
<meta name="theme-color" content="#E0596C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>
  :root {
    --beige-top: #F4ECD8;
    --beige-mid: #EFE4CE;
    --beige-bot: #E5D6B6;
    --watermelon: #E0596C;
    --coral: #F08A5D;
    --olive: #6F7C3E;
    --pink: #E89BA6;
    --ink: #2A241C;
    --ink-soft: #5A4F42;
    --ink-mute: #8A7E6B;
    --card: #FBF3DD;
    --card-edge: rgba(42, 36, 28, 0.10);
    --shadow-sm: 0 4px 12px rgba(42, 36, 28, 0.10);
    --shadow-md: 0 8px 22px rgba(42, 36, 28, 0.18);
    --shadow-lg: 0 16px 40px rgba(42, 36, 28, 0.22);
    --radius-card: 14px;
    --radius-pill: 9999px;
    --bg-page: linear-gradient(180deg, var(--beige-top) 0%, var(--beige-mid) 55%, var(--beige-bot) 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg-page); }
  body {
    font-family: 'Cairo', system-ui, sans-serif;
    color: var(--ink);
    direction: rtl;
    min-height: 100vh;
    background: var(--bg-page);
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  body::before { top: 10%; right: 12%; width: 320px; height: 320px; background: var(--watermelon); opacity: 0.28; }
  body::after { bottom: 10%; left: 14%; width: 300px; height: 300px; background: var(--olive); opacity: 0.25; }
  .grain::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.14;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 1;
  }
  .container {
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 0;
    position: relative;
    z-index: 2;
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 1.2px;
    color: var(--ink);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .tag::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--watermelon);
  }
  .title {
    font-size: 36px;
    font-weight: 900;
    line-height: 1;
    color: var(--ink);
    transform: rotate(-1deg);
    display: inline-block;
  }
  .title .grad {
    background: linear-gradient(90deg, var(--watermelon), var(--coral));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 700;
    margin-top: 8px;
  }

  /* QR Card */
  .qr-card {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 22px;
    padding: 28px 24px;
    box-shadow: var(--shadow-lg);
    transform: rotate(-0.5deg);
    margin-bottom: 20px;
    position: relative;
  }
  .qr-card::before {
    content: 'رمز الدخول';
    position: absolute;
    top: -10px;
    right: 24px;
    background: var(--watermelon);
    color: #FFF8E7;
    padding: 5px 18px;
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.2px;
    box-shadow: var(--shadow-sm);
  }

  .customer-info {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 2px dashed var(--card-edge);
  }
  .customer-info .name {
    font-size: 22px;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .customer-info .plan {
    font-size: 14px;
    color: var(--olive);
    font-weight: 700;
  }
  .customer-info .sub-id {
    font-family: 'Consolas', monospace;
    font-size: 12px;
    color: var(--ink-mute);
    margin-top: 6px;
    direction: ltr;
    font-weight: 900;
  }

  /* QR Container */
  .qr-wrapper {
    background: #FFF8E7;
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 20px;
    margin: 0 auto 20px;
    text-align: center;
    position: relative;
    max-width: 280px;
  }
  .qr-wrapper canvas, .qr-wrapper svg, .qr-wrapper img {
    display: block;
    margin: 0 auto;
    border-radius: 8px;
  }

  .qr-status {
    text-align: center;
    padding: 12px;
    background: rgba(111, 124, 62, 0.1);
    border-radius: var(--radius-card);
    margin-bottom: 16px;
  }
  .qr-status.active {
    background: rgba(111, 124, 62, 0.1);
    color: var(--olive);
  }
  .qr-status.expired {
    background: rgba(224, 89, 108, 0.1);
    color: var(--watermelon);
  }
  .qr-status.received-today {
    background: rgba(240, 138, 93, 0.12);
    color: var(--coral);
  }
  .qr-status .status-title {
    font-weight: 900;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .qr-status .status-text {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 700;
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-box {
    background: #FFF8E7;
    border: 1.5px solid var(--card-edge);
    border-radius: var(--radius-card);
    padding: 14px 12px;
    text-align: center;
  }
  .stat-box:nth-child(1) { transform: rotate(-0.5deg); border-right: 3px solid var(--olive); }
  .stat-box:nth-child(2) { transform: rotate(0.5deg); border-right: 3px solid var(--coral); }
  .stat-box .label {
    font-size: 10px;
    font-weight: 900;
    color: var(--ink-mute);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .stat-box .value {
    font-size: 22px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1;
  }

  /* Instructions */
  .instructions {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: var(--radius-card);
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-md);
    transform: rotate(0.3deg);
  }
  .instructions h3 {
    font-size: 16px;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .instructions h3::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--olive);
  }
  .instructions ol {
    list-style: none;
    padding: 0;
  }
  .instructions li {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 8px 0;
    padding-right: 32px;
    position: relative;
    line-height: 1.6;
  }
  .instructions li::before {
    content: counter(step);
    counter-increment: step;
    position: absolute;
    right: 0;
    top: 8px;
    width: 22px;
    height: 22px;
    background: var(--olive);
    color: #FFF8E7;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .instructions ol { counter-reset: step; }

  /* Allergy alert */
  .allergy-alert {
    background: var(--card);
    border: 2px solid var(--watermelon);
    border-right: 6px solid var(--watermelon);
    border-radius: var(--radius-card);
    padding: 14px 18px;
    margin-bottom: 16px;
    transform: rotate(-0.3deg);
    box-shadow: var(--shadow-md);
    animation: pulseWarm 2.5s ease-in-out infinite;
  }
  @keyframes pulseWarm {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224, 89, 108, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(224, 89, 108, 0); }
  }
  .allergy-alert .title {
    font-size: 13px;
    font-weight: 900;
    color: var(--watermelon);
    margin-bottom: 4px;
  }
  .allergy-alert .text {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 700;
    line-height: 1.5;
  }

  /* Buttons */
  .btn-row {
    display: grid;
    gap: 10px;
    margin-top: 8px;
  }
  .btn {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: var(--radius-pill);
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    box-shadow: var(--shadow-md);
    letter-spacing: 0.3px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--watermelon);
    color: #FFF8E7;
  }
  .btn-olive {
    background: var(--olive);
    color: #FFF8E7;
  }
  .btn-back {
    background: transparent;
    color: var(--ink-soft);
    box-shadow: none;
    border: 1.5px solid var(--card-edge);
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px) rotate(-0.5deg);
    box-shadow: var(--shadow-lg);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-mute);
    font-weight: 700;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(224, 89, 108, 0.2);
    border-top-color: var(--watermelon);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error-box {
    background: var(--card);
    border: 2px solid var(--watermelon);
    border-radius: var(--radius-card);
    padding: 30px 20px;
    text-align: center;
    box-shadow: var(--shadow-md);
  }
  .error-box .icon {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .error-box h2 {
    color: var(--watermelon);
    margin-bottom: 8px;
    font-weight: 900;
  }
  .error-box p {
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 700;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--olive);
    color: #FFF8E7;
    padding: 14px 24px;
    border-radius: var(--radius-card);
    font-weight: 900;
    z-index: 200;
    transition: transform 0.3s;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: var(--ink-mute);
    font-weight: 700;
  }

  @media print {
    body::before, body::after, .grain::after { display: none; }
    .btn-row, .footer { display: none; }
  }
</style>
</head>
<body class="grain">
<div class="container">

  <div class="header">
    <div class="tag">رمز الدخول الخاص بك</div>
    <h1 class="title"><span class="grad">Lite</span> Kitchen</h1>
    <div class="subtitle">احفظ هذه الصفحة في جوالك</div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      جاري تحميل بياناتك...
    </div>
  </div>

  <div class="footer">
    🔒 رمزك خاص بك. لا تشاركه مع أحد<br>
    8PM Healthy © 2026 · حائل
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://bmtlorchhzzbbrmlmmpf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ImtLuEDFKMHiQpoDaJCkSg_ghKxOFUA';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Simple checksum for QR validation
function makeChecksum(subId) {
  let hash = 0;
  const str = subId + 'LITE-KITCHEN-2026';
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash).toString(36).slice(0, 6).toUpperCase();
}

async function loadSubscription() {
  const params = new URLSearchParams(window.location.search);
  const subId = params.get('sub') || params.get('subscription_id');

  if (!subId) {
    $('content').innerHTML = `
      <div class="error-box">
        <div class="icon">❌</div>
        <h2>رابط غير صالح</h2>
        <p>لم نجد رقم اشتراك في الرابط</p>
      </div>
    `;
    return;
  }

  try {
    const { data: sub, error } = await sb
      .from('subscriptions')
      .select(`
        id, total_meals, consumed_meals, remaining_meals, status,
        payment_status, start_date, end_date,
        customers!inner(id, full_name, has_allergies, allergy_severity),
        plans(name_ar, meals_per_day)
      `)
      .eq('id', subId)
      .single();

    if (error || !sub) {
      $('content').innerHTML = `
        <div class="error-box">
          <div class="icon">❌</div>
          <h2>الاشتراك غير موجود</h2>
          <p>تحقق من الرابط أو تواصل معنا</p>
        </div>
      `;
      return;
    }

    if (sub.payment_status !== 'paid' || sub.status !== 'active') {
      $('content').innerHTML = `
        <div class="error-box">
          <div class="icon">⏳</div>
          <h2>الاشتراك غير مفعّل</h2>
          <p>الاشتراك في انتظار تأكيد الدفع. حاول لاحقاً.</p>
        </div>
      `;
      return;
    }

    const c = sub.customers;
    const mealsPerDay = sub.plans?.meals_per_day || 1;
    const daysRemaining = Math.ceil((sub.remaining_meals || 0) / mealsPerDay);
    const totalDays = sub.total_meals / mealsPerDay;
    const isExpired = daysRemaining <= 0;

    // Check if already received today
    const today = new Date();
    today.setHours(0,0,0,0);
    const { count: todayCount } = await sb
      .from('meal_logs')
      .select('*', { count: 'exact', head: true })
      .eq('subscription_id', sub.id)
      .gte('consumed_at', today.toISOString());

    const receivedToday = todayCount && todayCount > 0;

    // Build QR data: format = LK:SUB-XXXXX:CHECKSUM
    const checksum = makeChecksum(sub.id);
    const qrData = `LK:${sub.id}:${checksum}`;

    const statusBlock = isExpired
      ? `<div class="qr-status expired">
          <div class="status-title">⏳ انتهى الاشتراك</div>
          <div class="status-text">شكراً لاشتراكك معنا! نتطلع لخدمتك في الباقة القادمة</div>
        </div>`
      : receivedToday
      ? `<div class="qr-status received-today">
          <div class="status-title">✓ استلمت وجبات اليوم</div>
          <div class="status-text">عد غداً لاستلام وجبات اليوم الجديد</div>
        </div>`
      : `<div class="qr-status active">
          <div class="status-title">✓ جاهز للاستلام</div>
          <div class="status-text">امسح هذا الرمز في المطعم لاستلام وجبات اليوم</div>
        </div>`;

    const allergyBlock = c.has_allergies ? `
      <div class="allergy-alert">
        <div class="title">⚠ تنبيه: لديك حساسية مسجّلة في النظام</div>
        <div class="text">سيتم تنبيه الشيف تلقائياً عند المسح</div>
      </div>
    ` : '';

    $('content').innerHTML = `
      <div class="qr-card">
        <div class="customer-info">
          <div class="name">${escapeHtml(c.full_name)}</div>
          <div class="plan">${escapeHtml(sub.plans?.name_ar || '')}</div>
          <div class="sub-id">${sub.id}</div>
        </div>

        <div class="qr-wrapper" id="qrWrapper"></div>

        ${statusBlock}

        <div class="stats">
          <div class="stat-box">
            <div class="label">أيام متبقية</div>
            <div class="value">${daysRemaining}</div>
          </div>
          <div class="stat-box">
            <div class="label">أيام مستلمة</div>
            <div class="value">${totalDays - daysRemaining}</div>
          </div>
        </div>

        ${allergyBlock}
      </div>

      <div class="instructions">
        <h3>كيف تستخدم رمزك</h3>
        <ol>
          <li>احفظ هذه الصفحة (لقطة شاشة أو إضافة للمفضلة)</li>
          <li>تعال للمطعم في وقت تسليم الوجبات</li>
          <li>افتح الصورة واعرضها للشيف</li>
          <li>يمسحها الشيف بالكاميرا</li>
          <li>استلم وجباتك! 🌿</li>
        </ol>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn">
          📸 احفظ كصورة
        </button>
        <a href="https://wa.me/966558612908?text=استفسار%20عن%20اشتراكي%20${sub.id}" class="btn btn-olive" target="_blank">
          💬 تواصل معنا
        </a>
      </div>
    `;

    // Generate QR
    const qrContainer = $('qrWrapper');
    QRCode.toCanvas(qrData, {
      width: 240,
      margin: 1,
      color: {
        dark: '#2A241C',
        light: '#FFF8E7'
      },
      errorCorrectionLevel: 'H'
    }, (err, canvas) => {
      if (err) {
        qrContainer.innerHTML = '<div style="color:#E0596C">خطأ في توليد الرمز</div>';
        return;
      }
      qrContainer.innerHTML = '';
      qrContainer.appendChild(canvas);
    });

    // Save as image
    $('saveBtn').addEventListener('click', async () => {
      const canvas = qrContainer.querySelector('canvas');
      if (!canvas) return;
      try {
        canvas.toBlob(async (blob) => {
          if (navigator.share && navigator.canShare?.({ files: [new File([blob], 'qr.png', { type: 'image/png' })] })) {
            await navigator.share({
              files: [new File([blob], `${sub.id}.png`, { type: 'image/png' })],
              title: 'رمز اشتراك Lite Kitchen',
              text: `رمز اشتراك ${c.full_name} - ${sub.id}`
            });
          } else {
            // Fallback: download
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `lite-kitchen-${sub.id}.png`;
            a.click();
            showToast('✓ تم حفظ الرمز');
          }
        });
      } catch (e) {
        if (e.name !== 'AbortError') {
          showToast('تعذّر الحفظ');
        }
      }
    });

  } catch (e) {
    console.error(e);
    $('content').innerHTML = `
      <div class="error-box">
        <div class="icon">❌</div>
        <h2>خطأ في التحميل</h2>
        <p>${e.message}</p>
      </div>
    `;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadSubscription();
</script>
</body>
</html>
